name: Profile art

# Draws the pictures the README shows from live GitHub data and publishes
# them to the `output` branch: the contribution snake, the 3D contribution
# calendar and the activity card, each in a dark and a light version.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-art.yml
      - .github/profile-3d.json
      - tools/frame_calendar.py

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#cba6f7&color_dots=#313244,#4b3f66,#7a62a8,#a383d6,#cba6f7
            dist/snake-light.svg?color_snake=#8839ef&color_dots=#dce0e8,#d5c1f7,#b794f4,#9f63f0,#8839ef

      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d.json

      - name: Frame the calendar
        run: python3 tools/frame_calendar.py profile-3d-contrib dist

      - name: Activity card, dark
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          path: dist/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
          options: >-
            {"username": "${{ github.repository_owner }}", "custom_title": "On GitHub",
            "show_icons": true, "hide_rank": true, "hide": "stars",
            "show": "prs_merged,reviews", "include_all_commits": true,
            "card_width": 420, "line_height": 30, "border_radius": 14,
            "bg_color": "1e1e2e", "border_color": "313244", "title_color": "cba6f7",
            "icon_color": "89b4fa", "text_color": "cdd6f4"}

      - name: Activity card, light
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          path: dist/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
          options: >-
            {"username": "${{ github.repository_owner }}", "custom_title": "On GitHub",
            "show_icons": true, "hide_rank": true, "hide": "stars",
            "show": "prs_merged,reviews", "include_all_commits": true,
            "card_width": 420, "line_height": 30, "border_radius": 14,
            "bg_color": "eff1f5", "border_color": "ccd0da", "title_color": "8839ef",
            "icon_color": "1e66f5", "text_color": "4c4f69"}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: Update profile art
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Profile art

# Draws the activity card the README shows from live GitHub data, in a dark
# and a light version, and publishes it to the `output` branch.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-art.yml
      - tools/build_activity.py
      - tools/build_hero.py

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Activity card
        run: python3 tools/build_activity.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: Update profile art
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
